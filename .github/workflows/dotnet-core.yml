name: .NET 10

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore src/NtfsReader.slnx
      - name: Build
        run: dotnet build src/NtfsReader.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test src/NtfsReader.slnx --configuration Release --no-build --no-restore --verbosity normal

  publish-nuget:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore src/NtfsReader/NtfsReader.csproj
      - name: Pack
        run: dotnet pack src/NtfsReader/NtfsReader.csproj --configuration Release --no-restore --output artifacts -p:ContinuousIntegrationBuild=true
      - name: Publish package
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
